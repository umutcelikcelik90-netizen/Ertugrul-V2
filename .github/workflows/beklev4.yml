name: Build Android App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Missing Android Structure
      run: |
        mkdir -p app/src/main/java/com/ertugrul/v2 app/src/main/res/layout app/src/main/res/values
        if [ ! -f app/build.gradle ]; then
          echo 'apply plugin: "com.android.application"' > app/build.gradle
          echo 'android { compileSdk 33 }' >> app/build.gradle
        fi
        if [ ! -f settings.gradle ]; then
          echo 'include ":app"' > settings.gradle
        fi
        if [ ! -f app/src/main/AndroidManifest.xml ]; then
          echo '<manifest package="com.ertugrul.v2"><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/></manifest>' > app/src/main/AndroidManifest.xml
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
